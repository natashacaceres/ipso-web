};

function buildSteps(d, moment) {
  const st = moment === 'A' ? ['done', 'now', 'todo'] : ['done', 'done', 'now'];
  return d.steps.map((title, i) => ({
    n: i + 1, title, text: d[moment].texts[i],
    done: st[i] === 'done', now: st[i] === 'now', todo: st[i] === 'todo',
    fg: st[i] === 'now' ? '#000000' : '#4E534C', fg2: st[i] === 'now' ? '#000000' : '#4E534C'
  }));
}
function pageVals(lang, moment) {
  const d = T[lang];
  return { t: { title: d[moment].title, lead: d[moment].lead, hasCta: moment === 'A', cta: d.cta, ctaNote: d.ctaNote, help: d.help, legal: d.legal, priv: d.priv, cookies: d.cookies }, steps: buildSteps(d, moment) };
}
function initialLang() {
  let q = null, saved = null;
  try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  try { saved = localStorage.getItem('ipso-lang'); } catch (e) {}
  return T[q] ? q : (T[saved] ? saved : 'es');
}
const MOMENT = 'B';

class Component extends DCLogic {

    const lang = initialLang();
    if (lang !== 'es') this.setState({ lang });
    document.documentElement.lang = lang;

    const lang = this.state.lang;
