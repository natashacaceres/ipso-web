<style>

<script type="text/x-dc" data-dc-script>
const T = {
  es: { tag: 'IPSO HUB · Alta recibida', title: '¡Bienvenido a la familia Ipso!', lead: 'Gracias por confiar en nosotros. Ya tenemos todo lo que necesitamos para preparar tu HUB.', nowTitle: 'Qué pasa ahora', cta: 'Volver a Ipso', help1: '¿Alguna duda? Escríbenos por', help2: 'o a',

  en: { tag: 'IPSO HUB · Sign-up received', title: 'Welcome to the Ipso family!', lead: 'Thank you for trusting us. We now have everything we need to set up your HUB.', nowTitle: 'What happens next', cta: 'Back to Ipso', help1: 'Any questions? Message us on', help2: 'or at',
    steps: [['We set it up', 'We configure your HUB with your menu, your hours and your style.'], ['We send it to you', 'It is ready within 2-4 working days.'], ['You decide', 'Everything can be changed later from your dashboard.']] },
  ca: { tag: 'IPSO HUB · Alta rebuda', title: 'Benvingut a la família Ipso!', lead: 'Gràcies per confiar en nosaltres. Ja tenim tot el que necessitem per preparar el teu HUB.', nowTitle: 'Què passa ara', cta: 'Tornar a Ipso', help1: 'Algun dubte? Escriu-nos per', help2: 'o a',
    steps: [['El preparem', 'Configurem el teu HUB amb la teva carta, el teu horari i el teu estil.'], ['Te l\u2019enviem', 'El tens llest en 2-4 dies laborables.'], ['Tu decideixes', 'Tot es pot canviar després des del teu tauler.']] }
};

class Component extends DCLogic {
  state = { lang: 'es' };
  componentDidMount() {
    const q = new URLSearchParams(location.search).get('lang');
    let saved = null; try { saved = localStorage.getItem('ipso-lang'); } catch (e) {}
    const lang = T[q] ? q : (T[saved] ? saved : 'es');
    if (lang !== 'es') this.setState({ lang });
    document.documentElement.lang = lang;
  }
  renderVals() {
    const lang = this.state.lang, t = T[lang];
    return {
      t,
      steps: t.steps.map((s, i) => ({ n: i + 1, title: s[0], text: s[1] })),
      langs: ['es', 'en', 'ca'].map((c) => ({ code: c === 'ca' ? 'CAT' : c.toUpperCase(), on: c === lang ? 'true' : 'false', fg: c === lang ? '#1A1A1A' : '#9A9A9A', pick: () => { try { localStorage.setItem('ipso-lang', c); } catch (e) {} this.setState({ lang: c }); document.documentElement.lang = c; } }))
    };
  }
}
</script>
